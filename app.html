<div class="app-window" id="CalculatorApp">
  <div class="app-header">
    <span class="app-title">🧮 Calculator</span>
    <div class="app-controls"><button class="minimize-btn">–</button><button class="close-btn">×</button></div>
  </div>
  <div class="app-content">
    <div class="calc">
      <input id="calc-display" class="calc-display" type="text" value="0" readonly>
      <div class="calc-grid" id="calc-grid"></div>
    </div>
  </div>
  <div class="resize-handle"></div>
</div>
